name: Release

on:
  push:
    branches: [main]
  # Manual escape hatch: re-publish the current main (e.g. to recover from a
  # failed publish) without cutting a new release. Still gated below to require
  # a clean changeset state.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # No `publish:` here -> the action only ever opens the "Version Packages"
      # PR when changesets are pending. Publishing is gated below so routine
      # pushes don't run a no-op `pnpm publish`.
      - name: Open Version PR (when changesets are pending)
        id: cs
        uses: changesets/action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publish when (a) the Version Packages PR is merged into main — the
      # commit message carries the signal: a merge commit references the
      # `changeset-release/main` branch, a squash commit is titled
      # "Version Packages" — or (b) the workflow is dispatched manually.
      # NOTE: do not gate on the changesets action's hasChangesets output —
      # action v2 no longer emits it reliably in the no-changesets case
      # (observed 2026-09: step silently skipped). The commit-message gate
      # alone is sufficient: routine pushes never carry those markers.
      - name: Build, publish & tag release
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'changeset-release/main') || contains(github.event.head_commit.message, 'Version Packages')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm build
          pnpm --filter './packages/**' publish --no-git-checks
          tag=$(node scripts/release-notes.mjs tag)
          node scripts/release-notes.mjs body > /tmp/release-notes.md
          gh release create "$tag" --title "$tag" --notes-file /tmp/release-notes.md --target "$GITHUB_SHA"
